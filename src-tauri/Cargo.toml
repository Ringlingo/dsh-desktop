[package]
name = "dsh-portable"
version = "0.1.0"
description = "DeepSeek Harness portable desktop launcher (Tauri shell + node runtime)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dsh_portable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "native-tls"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_yaml = "0.9"
base64 = "0.22"
tokio = { version = "1", features = ["sync"] }
open = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }

[dev-dependencies]
